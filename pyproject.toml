[project]
name = "depuzzle"
version = "0.2.2"
description = "Inference profiler for local LLMs"
requires-python = ">=3.12,<3.14"
readme = "README.md"

dependencies = [
    "typer",
    "httpx",
    "mcp",
    "fastmcp",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TRY", "DTZ"]
ignore = [
    "TRY004",
    "TRY003",
    "B904",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["depuzzle"]

[project.scripts]
depuzzle = "depuzzle.cli:app"