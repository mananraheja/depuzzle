name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify package version matches Git tag
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"

          echo "Package version: $VERSION"
          echo "Git tag: $TAG"

          if [ "$VERSION" != "$TAG" ]; then
            echo "ERROR: Package version ($VERSION) does not match Git tag ($TAG)"
            exit 1
          fi

      - name: Install build and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build twine

      - name: Black
        run: black --check .

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest

      - name: Build distributions
        run: |
          rm -rf dist build
          python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create clean environment
        run: |
          python -m venv /tmp/depuzzle-pypi-test

      - name: Install from PyPI
        run: |
          /tmp/depuzzle-pypi-test/bin/python -m pip install depuzzle

      - name: Smoke test
        run: |
          /tmp/depuzzle-pypi-test/bin/depuzzle version
          /tmp/depuzzle-pypi-test/bin/depuzzle --help
          /tmp/depuzzle-pypi-test/bin/depuzzle profile --help
          /tmp/depuzzle-pypi-test/bin/depuzzle compare --help

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*