name: Release Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Package version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install build and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build twine

      - name: Black
        run: black --check .

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest

      - name: Build distributions
        run: |
          rm -rf dist build
          python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Create clean environment
        run: |
          python -m venv /tmp/depuzzle-test

      - name: Install from TestPyPI
        run: |
          for i in {1..10}; do
            if /tmp/depuzzle-test/bin/python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              --no-cache-dir \
              "depuzzle==$VERSION"; then
              exit 0
            fi

            echo "Package not available yet. Waiting 10 seconds..."
            sleep 10
          done

          echo "ERROR: depuzzle==$VERSION was not available on TestPyPI"
          exit 1
      
      - name: Verify installed version
        run: |
          INSTALLED=$(/tmp/depuzzle-test/bin/python -c \
            "import importlib.metadata; print(importlib.metadata.version('depuzzle'))")

          echo "Expected version: $VERSION"
          echo "Installed version: $INSTALLED"

          if [ "$INSTALLED" != "$VERSION" ]; then
            echo "ERROR: installed version does not match expected version"
            exit 1
          fi

      - name: Smoke test
        run: |
          /tmp/depuzzle-test/bin/depuzzle version
          /tmp/depuzzle-test/bin/depuzzle --help
          /tmp/depuzzle-test/bin/depuzzle profile --help
          /tmp/depuzzle-test/bin/depuzzle compare --help